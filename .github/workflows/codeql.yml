name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "15 7 * * 2"

permissions:
  contents: read

jobs:
  analyze:
    # CodeQL's 'actions' language analyzes our workflow files for
    # injection and untrusted-input patterns — complements zizmor with
    # GitHub's own query packs.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # v4.37.7
        with:
          languages: actions

      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # v4.37.7
